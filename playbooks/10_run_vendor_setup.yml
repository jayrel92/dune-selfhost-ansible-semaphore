---
- name: Detect public IP
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get public IP
      ansible.builtin.uri:
        url: https://api.ipify.org
        return_content: true
      register: detected_ip
    - name: Store detected IP
      ansible.builtin.set_fact:
        player_ip: "{{ detected_ip.content }}"

- name: Register Dune VM host
  hosts: localhost
  gather_facts: false
  vars:
    vm_ip: "10.10.4.201"
    player_ip_override: ""
    world_name: "Dune-Awakening-Server"
    world_region_choice: "3"
    self_host_token: "{{ self_host_token }}"
  tasks:
    - name: Select final player-facing IP
      ansible.builtin.set_fact:
        final_player_ip: >-
          {{
            player_ip_override
            if player_ip_override | length > 0
            else hostvars['localhost']['player_ip']
          }}
    - name: Add Dune VM to temporary inventory
      ansible.builtin.add_host:
        name: dunehost
        groups: dune_vm
        ansible_host: "{{ vm_ip }}"
        ansible_user: dune
        ansible_ssh_private_key_file: "/root/.ssh/ansible_ed25519"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        vm_ip: "{{ vm_ip }}"
        world_name: "{{ world_name }}"
        world_region_choice: "{{ world_region_choice }}"
        self_host_token: "{{ self_host_token }}"
        player_ip: "{{ final_player_ip }}"
